<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube de Desbravadores</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-blue-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Desbravadores Amazônia</h1>
            <div class="space-x-4">
                <a href="#" class="hover:text-yellow-400">História</a>
                <a href="#" class="hover:text-yellow-400">Agenda</a>
                <a href="#inscricao" class="bg-yellow-500 text-blue-900 px-4 py-2 rounded-full font-bold hover:bg-yellow-400">Inscrição</a>
            </div>
        </div>
    </nav>

    <header class="py-20 text-center bg-blue-800 text-white">
        <h2 class="text-4xl font-extrabold mb-4">Bem-vindo ao nosso Clube!</h2>
        <p class="text-lg opacity-90">Uma jornada de aventura, amizade e fé.</p>
    </header>

    <main class="container mx-auto p-8" id="inscricao">
        <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl border-t-4 border-yellow-500">
            <h3 class="text-3xl font-bold text-blue-900 mb-6 text-center">Ficha de Inscrição</h3>
            
            <form class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome Completo do Desbravador</label>
                    <input type="text" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: Mateus Santos">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Data de Nascimento</label>
                        <input type="date" class="w-full p-3 border border-gray-300 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Sexo</label>
                        <select class="w-full p-3 border border-gray-300 rounded-lg outline-none">
                            <option>Masculino</option>
                            <option>Feminino</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Telefone do Responsável</label>
                    <input type="tel" class="w-full p-3 border border-gray-300 rounded-lg outline-none" placeholder="(00) 00000-0000">
                </div>

                <button type="button" class="w-full bg-blue-900 text-white font-bold py-4 rounded-lg hover:bg-blue-800 transition duration-300 shadow-lg">
                    ENVIAR INSCRIÇÃO
                </button>
            </form>
        </div>
    </main>

</body>
</html>
